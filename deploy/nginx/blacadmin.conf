# nginx for the Blac Music Admin Site (blacadmin.pkasemer.com), next to the Backend's blacmusic.conf.
# Installed as /etc/nginx/sites-available/blacadmin.conf. It reuses the Backend's certificate files
# (/etc/nginx/blacmusic/*.pem): add the name to that certificate with certbot --expand (deploy/README.md).
#
# The name sits behind Cloudflare. The real visitor address comes from CF-Connecting-IP, trusted ONLY when
# the connection really is from a Cloudflare address (generated by the Backend's nginx-setup.sh).

server {
    listen 80;
    listen [::]:80;
    server_name blacadmin.pkasemer.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blacadmin.pkasemer.com;

    ssl_certificate     /etc/nginx/blacmusic/fullchain.pem;
    ssl_certificate_key /etc/nginx/blacmusic/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/blacmusic/cloudflare-realip.conf;

    client_max_body_size 2m;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Audio parts (up to 8 MiB each, a single file up to 16 MiB) are streamed through the site to storage.
    location = /api/uploads/part {
        client_max_body_size 20m;
        proxy_request_buffering off;       # stream the part on instead of spooling it to disk first
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header True-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: visitors must not choose their address
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header True-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
